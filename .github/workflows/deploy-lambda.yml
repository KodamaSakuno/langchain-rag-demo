name: Deploy Lambda

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "api.py"
      - "agent.py"
      - "config.py"
      - "handler.py"
      - "llm_providers/**"
      - "vector_stores/**"
      - "retrieval/**"
      - "frontend/**"
      - "requirements-lambda.txt"
      - "Dockerfile.lambda"
      - ".github/workflows/deploy-lambda.yml"

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  LAMBDA_FUNCTION: ${{ vars.LAMBDA_FUNCTION }}

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Smoke check (syntax)
        run: python -m py_compile api.py agent.py config.py handler.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile.lambda -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Update Lambda function
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --image-uri "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" > /dev/null
          aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION"
          echo "Function $LAMBDA_FUNCTION updated to $IMAGE_TAG"
